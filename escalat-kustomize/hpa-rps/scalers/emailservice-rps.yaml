apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: emailservice-rps
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: emailservice
  minReplicaCount: 1
  maxReplicaCount: 20
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 15
          policies:
          - type: Percent
            value: 100
            periodSeconds: 15
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://kube-prom-stack-kube-prome-prometheus.observability.svc.cluster.local:9090 
      metricName: istio_rps
      query: |
        sum(rate(istio_requests_total{reporter="destination", destination_workload="emailservice", destination_workload_namespace="default"}[1m]))
      threshold: '1'
